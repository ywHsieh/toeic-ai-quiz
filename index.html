<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Jun 多益練習</title>
  <style>
    :root {
      --primary-listening: #2563EB;
      --primary-reading: #D97706;
      --primary-profile: #7C3AED;
      --bg-color: #F3F4F6;
      --card-bg: #FFFFFF;
      --text-color: #1F2937;
      --success: #10B981;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 650px;
      padding: 24px;
      margin-top: 10px;
    }

    h1 { text-align: center; color: #111827; margin-top: 0; font-size: 22px; }

    .section-tabs { display: flex; background-color: #E5E7EB; border-radius: 12px; padding: 4px; margin-bottom: 16px; gap: 4px; }
    .sec-tab {
      flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 13px; font-weight: bold;
      border-radius: 8px; cursor: pointer; color: #4B5563; transition: all 0.2s; text-align: center;
    }
    .sec-tab.active-listening { background: var(--primary-listening); color: white; }
    .sec-tab.active-reading { background: var(--primary-reading); color: white; }
    .sec-tab.active-profile { background: var(--primary-profile); color: white; }

    .quiz-card, .profile-card { border: 1px solid #E5E7EB; border-radius: 12px; padding: 20px; position: relative; min-height: 300px; }
    .part-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    .badge-l { background-color: #DBEAFE; color: #1E40AF; }
    .badge-r { background-color: #FEF3C7; color: #92400E; }

    .passage-box { background: #FFFBEB; border-left: 4px solid var(--primary-reading); padding: 12px; border-radius: 6px; font-size: 13.5px; line-height: 1.7; margin-bottom: 14px; white-space: pre-line; }
    
    .audio-control-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-audio { flex: 3; background-color: var(--primary-listening); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: opacity 0.2s; }
    .btn-audio:hover { opacity: 0.9; }

    .speed-select {
      flex: 1;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      background: white;
      font-size: 13px;
      font-weight: bold;
      color: #1E293B;
      cursor: pointer;
    }

    .question-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.6; white-space: pre-line; }

    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; background: white; text-align: left; font-size: 14px; cursor: pointer; transition: all 0.2s; line-height: 1.5; }
    .opt-btn.correct { background: #D1FAE5 !important; border-color: #10B981 !important; color: #065F46; font-weight: bold; }
    .opt-btn.incorrect { background: #FEE2E2 !important; border-color: #EF4444 !important; color: #991B1B; }

    .analysis-box {
      margin-top: 16px;
      padding: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
    }

    .analysis-status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #E2E8F0;
    }

    .transcript-box {
      background: #EFF6FF;
      border-left: 4px solid var(--primary-listening);
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      line-height: 1.6;
      font-size: 13.5px;
    }

    .translation-box {
      background: #FEF3C7;
      border-left: 4px solid var(--primary-reading);
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      line-height: 1.6;
      font-size: 13.5px;
      color: #78350F;
    }

    .analysis-section {
      margin-top: 12px;
      padding: 12px;
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid #E5E7EB;
    }

    .analysis-title {
      font-weight: bold;
      color: #1F2937;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vocab-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 13.5px;
    }
    .vocab-table th, .vocab-table td {
      border: 1px solid #E5E7EB;
      padding: 6px 10px;
      text-align: left;
    }
    .vocab-table th {
      background-color: #F1F5F9;
      color: #334155;
    }

    .next-btn { width: 100%; margin-top: 14px; padding: 12px; background: #111827; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: none; }
    
    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; font-weight: bold; color: #4B5563;
      z-index: 10; text-align: center; padding: 20px;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px; text-align: center; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--primary-profile); margin-top: 4px; }
    .stat-label { font-size: 12px; color: #64748B; }

    .wrong-list { display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; }
    .wrong-item { background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .wrong-info { font-size: 13px; font-weight: 500; color: #991B1B; flex: 1; margin-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-remove { background: #EF4444; color: white; }
    .btn-review { background: #2563EB; color: white; }
    .btn-reset-all { background: #DC2626; color: white; padding: 6px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-reset-all:hover { opacity: 0.9; }

    /* 全面客製化網頁置中 Modal */
    .custom-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      animation: fadeIn 0.2s ease-out;
    }

    .custom-modal-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
      animation: scaleUp 0.2s ease-out;
    }

    .custom-modal-icon { font-size: 36px; margin-bottom: 8px; }
    .custom-modal-title { font-size: 18px; font-weight: bold; color: #1E293B; margin-bottom: 8px; }
    .custom-modal-msg { font-size: 14px; color: #4B5563; margin-bottom: 20px; line-height: 1.5; }
    
    .custom-modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-btn-primary { background: #EF4444; color: white; }
    .modal-btn-primary:hover { background: #DC2626; }
    .modal-btn-secondary { background: #E5E7EB; color: #374151; }
    .modal-btn-secondary:hover { background: #D1D5DB; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

  <div class="container">
    <h1>🤖 A Jun 多益練習</h1>

    <div class="section-tabs">
      <button class="sec-tab active-listening" onclick="selectSection('listening')">🎧 聽力題型</button>
      <button class="sec-tab" onclick="selectSection('reading')">📖 閱讀題型</button>
      <button class="sec-tab" onclick="selectSection('profile')">📊 個人紀錄</button>
    </div>

    <div class="quiz-card" id="quiz-card">
      <div id="loading" class="loading-overlay" style="display:none;">
        <div id="loading-text">⚡ AI 生成題目中，請耐心等候...</div>
      </div>

      <div class="part-header">
        <span id="part-badge" class="badge badge-l">Part --</span>
        <button onclick="fetchNewQuestionFromAI()" style="padding: 4px 10px; font-size: 12px; cursor: pointer; border-radius: 6px; border: 1px solid #D1D5DB; background: white;">🔄 換一題</button>
      </div>

      <div id="passage-box" class="passage-box" style="display:none;"></div>

      <div id="audio-control-container" class="audio-control-bar" style="display:none;">
        <button id="audio-btn" class="btn-audio" onclick="playCurrentAudio()">
          🔊 點擊播放聽力語音
        </button>
        <select id="playback-speed" class="speed-select">
          <option value="0.75">0.75x 慢速</option>
          <option value="1.0" selected>1.0x 正常</option>
          <option value="1.25">1.25x 快速</option>
          <option value="1.5">1.5x 挑戰</option>
        </select>
      </div>

      <div class="question-title" id="question-text">載入中...</div>
      <div class="options-list" id="options-box"></div>
      <div class="analysis-box" id="analysis-box"></div>
      <button class="next-btn" id="next-btn" onclick="fetchNewQuestionFromAI()">下一題👉</button>
    </div>

    <div class="profile-card" id="profile-card" style="display: none;">
      <div class="profile-header">
        <h3 style="margin: 0; color: #1E293B; font-size: 18px;">📊 我的個人紀錄</h3>
        <button onclick="resetAllStats()" class="btn-reset-all">🗑️ 清除所有個人紀錄</button>
      </div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">總練習題數</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">答對題數</div>
          <div class="stat-value" id="stat-correct" style="color: #059669;">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">整體正確率</div>
          <div class="stat-value" id="stat-rate">0%</div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h4 style="margin: 0; color: #1E293B;">📚 我的錯題本 (<span id="wrong-count">0</span>)</h4>
        <button onclick="clearWrongBook()" class="btn-sm" style="background: #E5E7EB; color: #374151;">清空錯題本</button>
      </div>

      <div class="wrong-list" id="wrong-list-container">
        <div style="text-align: center; color: #94A3B8; padding: 30px; font-size: 13.5px;">目前沒有錯題紀錄，繼續保持！ 🎉</div>
      </div>
    </div>

  </div>

  <!-- 置中通用 Modal 彈窗 -->
  <div id="custom-modal" class="custom-modal-overlay" style="display: none;">
    <div class="custom-modal-card">
      <div class="custom-modal-icon" id="modal-icon">⚠️</div>
      <div class="custom-modal-title" id="modal-title">系統提示</div>
      <div class="custom-modal-msg" id="modal-text"></div>
      <div class="custom-modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://toeic-ai-quiz.ellen6225.workers.dev";

    let currentSection = 'listening';
    let currentQuestion = null;
    let isAnswered = false;
    let isFetching = false;

    let userStats = JSON.parse(localStorage.getItem('toeic_stats')) || { total: 0, correct: 0 };
    let wrongBook = JSON.parse(localStorage.getItem('toeic_wrong_book')) || [];

    let systemVoices = [];
    function loadVoices() {
      systemVoices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    window.onload = () => {
      fetchNewQuestionFromAI();
    };

    // 單按鈕提示 Modal
    function showCustomError(message, title = "系統提示", icon = "⚠️") {
      document.getElementById('modal-icon').innerText = icon;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-text').innerText = message;
      document.getElementById('modal-actions').innerHTML = `
        <button class="modal-btn modal-btn-primary" onclick="hideCustomModal()">確定</button>
      `;
      document.getElementById('custom-modal').style.display = 'flex';
    }

    // 雙按鈕 Confirm Modal
    function showConfirmModal(message, title = "確認操作", icon = "❓") {
      return new Promise((resolve) => {
        document.getElementById('modal-icon').innerText = icon;
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = message;
        
        document.getElementById('modal-actions').innerHTML = `
          <button class="modal-btn modal-btn-secondary" id="modal-btn-cancel">取消</button>
          <button class="modal-btn modal-btn-primary" id="modal-btn-confirm">確定</button>
        `;

        document.getElementById('modal-btn-cancel').onclick = () => {
          hideCustomModal();
          resolve(false);
        };
        document.getElementById('modal-btn-confirm').onclick = () => {
          hideCustomModal();
          resolve(true);
        };

        document.getElementById('custom-modal').style.display = 'flex';
      });
    }

    function hideCustomModal() {
      document.getElementById('custom-modal').style.display = 'none';
    }

    function formatText(str) {
      if (!str) return '';
      return str.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
    }

    function selectSection(sec) {
      if (currentSection === sec && sec !== 'profile') return;
      currentSection = sec;
      const tabs = document.querySelectorAll('.sec-tab');
      tabs.forEach(tab => tab.className = 'sec-tab');

      const quizCard = document.getElementById('quiz-card');
      const profileCard = document.getElementById('profile-card');

      if (sec === 'listening') {
        tabs[0].classList.add('active-listening');
        quizCard.style.display = 'block';
        profileCard.style.display = 'none';
        fetchNewQuestionFromAI();
      } else if (sec === 'reading') {
        tabs[1].classList.add('active-reading');
        quizCard.style.display = 'block';
        profileCard.style.display = 'none';
        fetchNewQuestionFromAI();
      } else if (sec === 'profile') {
        tabs[2].classList.add('active-profile');
        quizCard.style.display = 'none';
        profileCard.style.display = 'block';
        renderProfile();
      }
    }

    function updateStats(isCorrect) {
      userStats.total++;
      if (isCorrect) userStats.correct++;
      localStorage.setItem('toeic_stats', JSON.stringify(userStats));
    }

    function saveWrongQuestion(q) {
      if (!wrongBook.some(item => item.question === q.question)) {
        wrongBook.unshift(q);
        localStorage.setItem('toeic_wrong_book', JSON.stringify(wrongBook));
      }
    }

    function renderProfile() {
      document.getElementById('stat-total').innerText = userStats.total;
      document.getElementById('stat-correct').innerText = userStats.correct;
      const rate = userStats.total > 0 ? Math.round((userStats.correct / userStats.total) * 100) : 0;
      document.getElementById('stat-rate').innerText = rate + '%';
      
      document.getElementById('wrong-count').innerText = wrongBook.length;

      const container = document.getElementById('wrong-list-container');
      if (wrongBook.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #94A3B8; padding: 30px; font-size: 13.5px;">目前沒有錯題紀錄，繼續保持！ 🎉</div>`;
        return;
      }

      container.innerHTML = wrongBook.map((q, index) => `
        <div class="wrong-item">
          <div class="wrong-info"><strong>[${q.partName || '多益題目'}]</strong> ${q.question}</div>
          <div style="display: flex; gap: 6px;">
            <button class="btn-sm btn-review" onclick="reviewWrongQuestion(${index})">複習</button>
            <button class="btn-sm btn-remove" onclick="removeWrongQuestion(${index})">刪除</button>
          </div>
        </div>
      `).join('');
    }

    function reviewWrongQuestion(index) {
      const q = wrongBook[index];
      currentSection = q.section || 'listening';
      currentQuestion = q;
      
      const tabs = document.querySelectorAll('.sec-tab');
      tabs.forEach(tab => tab.className = 'sec-tab');
      if (currentSection === 'listening') tabs[0].classList.add('active-listening');
      else tabs[1].classList.add('active-reading');

      document.getElementById('quiz-card').style.display = 'block';
      document.getElementById('profile-card').style.display = 'none';

      renderQuestion(q);
    }

    function removeWrongQuestion(index) {
      wrongBook.splice(index, 1);
      localStorage.setItem('toeic_wrong_book', JSON.stringify(wrongBook));
      renderProfile();
    }

    // 改用置中 Modal
    async function clearWrongBook() {
      const confirmed = await showConfirmModal("確定要清空所有錯題紀錄嗎？此動作無法復原。", "清空錯題本");
      if (confirmed) {
        wrongBook = [];
        localStorage.removeItem('toeic_wrong_book');
        renderProfile();
      }
    }

    // 改用置中 Modal
    async function resetAllStats() {
      const confirmed = await showConfirmModal("確定要將所有練習數據與錯題紀錄全部清零嗎？此動作無法復原。", "清空所有紀錄");
      if (confirmed) {
        userStats = { total: 0, correct: 0 };
        wrongBook = [];
        localStorage.removeItem('toeic_stats');
        localStorage.removeItem('toeic_wrong_book');
        renderProfile();
      }
    }

    async function fetchNewQuestionFromAI() {
      if (isFetching) return;
      isFetching = true;

      const loadingEl = document.getElementById('loading');
      const loadingText = document.getElementById('loading-text');
      
      document.getElementById('analysis-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      isAnswered = false;

      loadingText.innerText = "⚡ AI 生成題目中，請耐心等候...";
      loadingEl.style.display = 'flex';

      // 聽力題型僅採用 p2, p3, p4 (完全排除 p1 圖片題)
      const parts = currentSection === 'listening' ? ['p2', 'p3', 'p4'] : ['p5', 'p6', 'p7'];
      const randomPart = parts[Math.floor(Math.random() * parts.length)];

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentSection, randomPart })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "中繼站回應異常");
        }

        let rawJsonStr = data.candidates[0].content.parts[0].text;
        rawJsonStr = rawJsonStr.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();

        currentQuestion = JSON.parse(rawJsonStr);
        renderQuestion(currentQuestion);
      } catch (err) {
        console.error("解析失敗詳情：", err);
        showCustomError("AI 努力生成題目中，建議稍候片刻後再試一次！", "出題提示");
      } finally {
        loadingEl.style.display = 'none';
        isFetching = false;
      }
    }

    function isPart2(q) {
      if (!q) return false;
      const partName = (q.partName || '').toLowerCase();
      return partName.includes('part 2') || partName.includes('part2') || partName.includes('p2');
    }

    function renderQuestion(q) {
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('part-badge').innerText = q.partName || (q.section === 'listening' ? '聽力測驗' : '閱讀測驗');
      document.getElementById('part-badge').className = `badge ${q.section === 'listening' ? 'badge-l' : 'badge-r'}`;

      const passageBox = document.getElementById('passage-box');
      if (q.passage && q.section !== 'listening') {
        passageBox.style.display = 'block';
        passageBox.innerHTML = formatText(q.passage);
      } else {
        passageBox.style.display = 'none';
      }

      const audioContainer = document.getElementById('audio-control-container');
      audioContainer.style.display = (q.section === 'listening') ? 'flex' : 'none';

      if (isPart2(q)) {
        document.getElementById('question-text').innerText = "🔊 點擊播放聽力語音";
      } else {
        document.getElementById('question-text').innerText = q.question;
      }

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      const optionLabels = ['(A)', '(B)', '(C)', '(D)'];
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        
        let cleanOptText = opt.trim();
        const hasPrefix = /^\([A-D]\)/i.test(cleanOptText);
        const prefix = optionLabels[i] || `(${String.fromCharCode(65 + i)})`;

        btn.innerText = hasPrefix ? cleanOptText : `${prefix} ${cleanOptText}`;
        btn.onclick = () => handleAnswer(i);
        optionsBox.appendChild(btn);
      });

      if (isPart2(q)) {
        setTimeout(() => playCurrentAudio(), 300);
      }
    }

    function playCurrentAudio() {
      if (!currentQuestion) return;
      window.speechSynthesis.cancel();

      const rawScript = isPart2(currentQuestion) 
        ? currentQuestion.question 
        : (currentQuestion.audioScript || currentQuestion.script || currentQuestion.conversation || currentQuestion.passage || currentQuestion.question);

      const lines = rawScript.split('\n').filter(line => line.trim() !== '');

      const speedSelect = document.getElementById('playback-speed');
      const selectedRate = parseFloat(speedSelect.value) || 1.0;

      const enVoices = systemVoices.filter(v => v.lang.startsWith('en'));
      const femaleVoice = enVoices.find(v => /female|zira|samantha|victoria|karen/i.test(v.name)) || enVoices[0];
      const maleVoice = enVoices.find(v => /male|david|alex|george|daniel/i.test(v.name)) || enVoices[1] || enVoices[0];

      let currentLineIndex = 0;

      function speakNextLine() {
        if (currentLineIndex >= lines.length) return;

        const originalLine = lines[currentLineIndex++];
        const isMan = /(^|\b)(man|male|speaker\s*1|m)(\b|[:：])/i.test(originalLine);

        let cleanText = originalLine
          .replace(/^(man|woman|speaker\s*\d+|m|w|speaker\s*[a-z])\s*[:：.-]*/i, '')
          .replace(/^[^:：]+[:：]\s*/, '')
          .replace(/\b(man|woman|speaker\s*\d+)\b/gi, '')
          .replace(/\([^)]*\)/g, '')
          .replace(/\[[^\]]*\]/g, '')
          .trim();

        if (!cleanText) {
          speakNextLine(); 
          return;
        }

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = selectedRate;

        if (isMan) {
          if (maleVoice) utterance.voice = maleVoice;
          utterance.pitch = 0.85;
        } else {
          if (femaleVoice) utterance.voice = femaleVoice;
          utterance.pitch = 1.15;
        }

        utterance.onend = speakNextLine;
        window.speechSynthesis.speak(utterance);
      }

      speakNextLine();
    }

    function handleAnswer(selectedIndex) {
      if (isAnswered) return;
      isAnswered = true;

      if (isPart2(currentQuestion)) {
        document.getElementById('question-text').innerText = currentQuestion.question;
      }

      const isCorrect = selectedIndex === currentQuestion.answer;
      
      updateStats(isCorrect);
      if (!isCorrect) {
        saveWrongQuestion(currentQuestion);
      }

      const btns = document.querySelectorAll('.opt-btn');
      btns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btns[selectedIndex].classList.add('correct');
      } else {
        btns[selectedIndex].classList.add('incorrect');
        btns[currentQuestion.answer].classList.add('correct');
      }

      const analysisBox = document.getElementById('analysis-box');
      analysisBox.style.display = 'block';

      let scriptContent = currentQuestion.audioScript || currentQuestion.script || currentQuestion.conversation || (currentQuestion.section === 'listening' ? currentQuestion.passage : null);

      let transcriptHtml = '';
      if (currentQuestion.section === 'listening' && scriptContent) {
        let cleanScript = formatText(scriptContent.replace(/【[^】]+】/g, '').trim());

        transcriptHtml = `
          <div class="transcript-box" style="margin-bottom: 16px;">
            <div style="font-weight:bold; color:#1E40AF; margin-bottom:6px;">📝 聽力音檔逐字稿：</div>
            <div style="line-height: 1.6;">${cleanScript}</div>
          </div>
        `;
      }

      let translationHtml = '';
      if (currentQuestion.translation) {
        let cleanTrans = formatText(currentQuestion.translation.replace(/【[^】]+】/g, '').trim());
        let qTranslation = currentQuestion.questionTranslation ? `<br><br><strong>題目翻譯：</strong>${formatText(currentQuestion.questionTranslation)}` : '';

        translationHtml = `
          <div class="translation-box" style="margin-bottom: 16px;">
            <div style="font-weight:bold; color:#92400E; margin-bottom:6px;">🌐 中文完整逐字翻譯：</div>
            <div style="line-height: 1.6;">${cleanTrans}${qTranslation}</div>
          </div>
        `;
      }

      let vocabHtml = '';
      if (currentQuestion.vocabularies && currentQuestion.vocabularies.length > 0) {
        let rows = currentQuestion.vocabularies.map(v => `
          <tr>
            <td><strong>${v.word}</strong></td>
            <td><em>${v.pos}</em></td>
            <td>${v.meaning}</td>
          </tr>
        `).join('');

        vocabHtml = `
          <div class="analysis-section" style="margin-top: 16px;">
            <div class="analysis-title">📚 多益重要單字：</div>
            <table class="vocab-table">
              <thead>
                <tr><th>單字 / 片語</th><th>詞性</th><th>中文意思</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      const rawExplanation = (currentQuestion.explanation || '').replace(/【[^】]+】/g, '').trim();
      const formattedExplanation = formatText(
        rawExplanation
          .replace(/(題目解析|考點說明)[:：]?/g, '\n<strong>$1：</strong>\n')
          .replace(/(選項解析)[:：]?/g, '\n\n<strong>$1：</strong>\n')
      );

      analysisBox.innerHTML = `
        <div class="analysis-status" style="color: ${isCorrect ? '#059669' : '#DC2626'}">
          ${isCorrect ? '🎉 回答正確！' : '❌ 答錯囉！正確答案是：' + ['(A)', '(B)', '(C)', '(D)'][currentQuestion.answer]}
        </div>
        
        ${transcriptHtml}
        ${translationHtml}

        <div class="analysis-section">
          <div class="analysis-title">💡 題目與選項解析：</div>
          <div style="line-height: 1.6; margin-top: 6px;">${formattedExplanation}</div>
        </div>

        ${vocabHtml}
      `;

      document.getElementById('next-btn').style.display = 'block';
    }
  </script>
</body>
</html>
