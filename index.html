<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Jun 多益練習</title>
  <style>
    :root {
      --primary-listening: #2563EB;
      --primary-reading: #D97706;
      --bg-color: #F3F4F6;
      --card-bg: #FFFFFF;
      --text-color: #1F2937;
      --success: #10B981;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 650px;
      padding: 24px;
      margin-top: 10px;
    }

    h1 { text-align: center; color: #111827; margin-top: 0; font-size: 22px; }

    .section-tabs { display: flex; background-color: #E5E7EB; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .sec-tab {
      flex: 1; padding: 10px 0; border: none; background: transparent; font-size: 14px; font-weight: bold;
      border-radius: 8px; cursor: pointer; color: #4B5563; transition: all 0.2s;
    }
    .sec-tab.active-listening { background: var(--primary-listening); color: white; }
    .sec-tab.active-reading { background: var(--primary-reading); color: white; }

    .quiz-card { border: 1px solid #E5E7EB; border-radius: 12px; padding: 20px; position: relative; min-height: 300px; }
    .part-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; }
    .badge-l { background-color: #DBEAFE; color: #1E40AF; }
    .badge-r { background-color: #FEF3C7; color: #92400E; }

    .part1-image { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-bottom: 16px; }
    .passage-box { background: #FFFBEB; border-left: 4px solid var(--primary-reading); padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; white-space: pre-line; }
    
    .audio-control-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-audio { flex: 3; background-color: var(--primary-listening); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: opacity 0.2s; }
    .btn-audio:hover { opacity: 0.9; }

    .speed-select {
      flex: 1;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      background: white;
      font-size: 13px;
      font-weight: bold;
      color: #1E293B;
      cursor: pointer;
    }

    .question-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.6; white-space: pre-line; }

    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .opt-btn { padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; background: white; text-align: left; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .opt-btn.correct { background: #D1FAE5 !important; border-color: #10B981 !important; color: #065F46; font-weight: bold; }
    .opt-btn.incorrect { background: #FEE2E2 !important; border-color: #EF4444 !important; color: #991B1B; }

    .analysis-box {
      margin-top: 16px;
      padding: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      display: none;
      font-size: 14px;
      line-height: 1.6;
    }

    .analysis-status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #E2E8F0;
    }

    .transcript-box {
      background: #EFF6FF;
      border-left: 4px solid var(--primary-listening);
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      line-height: 1.6;
      font-size: 13.5px;
    }

    .translation-box {
      background: #FEF3C7;
      border-left: 4px solid var(--primary-reading);
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      line-height: 1.6;
      font-size: 13.5px;
      color: #78350F;
    }

    .analysis-section {
      margin-top: 12px;
      padding: 12px;
      background: #FFFFFF;
      border-radius: 8px;
      border: 1px solid #E5E7EB;
    }

    .analysis-title {
      font-weight: bold;
      color: #1F2937;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vocab-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
      font-size: 13.5px;
    }
    .vocab-table th, .vocab-table td {
      border: 1px solid #E5E7EB;
      padding: 6px 10px;
      text-align: left;
    }
    .vocab-table th {
      background-color: #F1F5F9;
      color: #334155;
    }

    .next-btn { width: 100%; margin-top: 14px; padding: 12px; background: #111827; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: none; }
    
    .loading-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9);
      display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; font-weight: bold; color: #4B5563;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🤖 A Jun 多益練習</h1>

    <div class="section-tabs">
      <button class="sec-tab active-listening" onclick="selectSection('listening')">🎧 聽力題型</button>
      <button class="sec-tab" onclick="selectSection('reading')">📖 閱讀題型</button>
    </div>

    <div class="quiz-card" id="quiz-card">
      <div id="loading" class="loading-overlay" style="display:none;">
        <div>⚡ AI 生成題目中，請耐心等候...</div>
      </div>

      <div class="part-header">
        <span id="part-badge" class="badge badge-l">Part --</span>
        <button onclick="fetchNewQuestionFromAI()" style="padding: 4px 10px; font-size: 12px; cursor: pointer; border-radius: 6px; border: 1px solid #D1D5DB; background: white;">🔄 換一題</button>
      </div>

      <img id="question-img" class="part1-image" src="" alt="Part 1 照片" style="display:none;" />
      <div id="passage-box" class="passage-box" style="display:none;"></div>

      <div id="audio-control-container" class="audio-control-bar" style="display:none;">
        <button id="audio-btn" class="btn-audio" onclick="playCurrentAudio()">
          🔊 點擊播放聽力語音 (TTS)
        </button>
        <select id="playback-speed" class="speed-select">
          <option value="0.75">0.75x 慢速</option>
          <option value="1.0" selected>1.0x 正常</option>
          <option value="1.25">1.25x 快速</option>
          <option value="1.5">1.5x 挑戰</option>
        </select>
      </div>

      <div class="question-title" id="question-text">載入中...</div>
      <div class="options-list" id="options-box"></div>
      <div class="analysis-box" id="analysis-box"></div>
      <button class="next-btn" id="next-btn" onclick="fetchNewQuestionFromAI()">下一題👉</button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://toeic-ai-quiz.ellen6225.workers.dev";

    let currentSection = 'listening';
    let currentQuestion = null;
    let isAnswered = false;

    let systemVoices = [];
    function loadVoices() {
      systemVoices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    window.onload = () => {
      fetchNewQuestionFromAI();
    };

    function selectSection(sec) {
      currentSection = sec;
      const tabs = document.querySelectorAll('.sec-tab');
      tabs.forEach(tab => tab.className = 'sec-tab');
      if (sec === 'listening') tabs[0].classList.add('active-listening');
      else tabs[1].classList.add('active-reading');

      fetchNewQuestionFromAI();
    }

    async function fetchNewQuestionFromAI() {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('analysis-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      isAnswered = false;

      const parts = currentSection === 'listening' ? ['p1', 'p2', 'p3', 'p4'] : ['p5', 'p6', 'p7'];
      const randomPart = parts[Math.floor(Math.random() * parts.length)];

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentSection, randomPart })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || "中繼站回應異常");
        }

        let rawJsonStr = data.candidates[0].content.parts[0].text;
        rawJsonStr = rawJsonStr.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();

        currentQuestion = JSON.parse(rawJsonStr);
        renderQuestion(currentQuestion);
      } catch (err) {
        console.error("解析失敗詳情：", err);
        alert(`生成失敗：${err.message}`);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderQuestion(q) {
      document.getElementById('part-badge').innerText = q.partName;
      document.getElementById('part-badge').className = `badge ${q.section === 'listening' ? 'badge-l' : 'badge-r'}`;

      const qImg = document.getElementById('question-img');
      if (q.imageUrl && q.part === 'p1') {
        qImg.src = q.imageUrl;
        qImg.style.display = 'block';
      } else {
        qImg.style.display = 'none';
      }

      const passageBox = document.getElementById('passage-box');
      if (q.passage) {
        passageBox.style.display = 'block';
        passageBox.innerHTML = q.passage.replace(/\n/g, '<br>');
      } else {
        passageBox.style.display = 'none';
      }

      const audioContainer = document.getElementById('audio-control-container');
      audioContainer.style.display = (q.section === 'listening') ? 'flex' : 'none';

      document.getElementById('question-text').innerText = q.question;

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(i);
        optionsBox.appendChild(btn);
      });
    }

    function playCurrentAudio() {
      if (!currentQuestion) return;
      window.speechSynthesis.cancel();

      const rawScript = currentQuestion.audioScript || currentQuestion.question;
      const lines = rawScript.split('\n').filter(line => line.trim() !== '');

      const speedSelect = document.getElementById('playback-speed');
      const selectedRate = parseFloat(speedSelect.value) || 1.0;

      const enVoices = systemVoices.filter(v => v.lang.startsWith('en'));
      const femaleVoice = enVoices.find(v => /female|zira|samantha|victoria|karen/i.test(v.name)) || enVoices[0];
      const maleVoice = enVoices.find(v => /male|david|alex|george|daniel/i.test(v.name)) || enVoices[1] || enVoices[0];

      let currentLineIndex = 0;

      function speakNextLine() {
        if (currentLineIndex >= lines.length) return;

        const originalLine = lines[currentLineIndex++];
        const isMan = /(^|\b)(man|male|speaker\s*1|m)(\b|[:：])/i.test(originalLine);

        let cleanText = originalLine
          .replace(/^(man|woman|speaker\s*\d+|m|w|speaker\s*[a-z])\s*[:：.-]*/i, '')
          .replace(/^[^:：]+[:：]\s*/, '')
          .replace(/\b(man|woman|speaker\s*\d+)\b/gi, '')
          .replace(/\([^)]*\)/g, '')
          .replace(/\[[^\]]*\]/g, '')
          .trim();

        if (!cleanText) {
          speakNextLine(); 
          return;
        }

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = selectedRate;

        if (isMan) {
          if (maleVoice) utterance.voice = maleVoice;
          utterance.pitch = 0.85;
        } else {
          if (femaleVoice) utterance.voice = femaleVoice;
          utterance.pitch = 1.15;
        }

        utterance.onend = speakNextLine;
        window.speechSynthesis.speak(utterance);
      }

      speakNextLine();
    }

    function handleAnswer(selectedIndex) {
      if (isAnswered) return;
      isAnswered = true;

      const isCorrect = selectedIndex === currentQuestion.answer;
      const btns = document.querySelectorAll('.opt-btn');

      btns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btns[selectedIndex].classList.add('correct');
      } else {
        btns[selectedIndex].classList.add('incorrect');
        btns[currentQuestion.answer].classList.add('correct');
      }

      const analysisBox = document.getElementById('analysis-box');
      analysisBox.style.display = 'block';

      let transcriptHtml = '';
      if (currentQuestion.section === 'listening' && currentQuestion.audioScript) {
        // 清理逐字稿中的大標題，並將 \n 轉為 <br>
        let cleanScript = currentQuestion.audioScript
          .replace(/【[^】]+】/g, '')
          .trim()
          .replace(/\n/g, '<br>');

        transcriptHtml = `
          <div class="transcript-box">
            <div style="font-weight:bold; color:#1E40AF; margin-bottom:4px;">📝 聽力音檔逐字稿：</div>
            ${cleanScript}
          </div>
        `;
      }

      let translationHtml = '';
      if (currentQuestion.translation) {
        // 清理翻譯中的大標題，並將 \n 轉為 <br>
        let cleanTrans = currentQuestion.translation
          .replace(/【[^】]+】/g, '')
          .trim()
          .replace(/\n/g, '<br>');

        translationHtml = `
          <div class="translation-box">
            <div style="font-weight:bold; color:#92400E; margin-bottom:4px;">🌐 中文完整逐字翻譯：</div>
            ${cleanTrans}
          </div>
        `;
      }

      let vocabHtml = '';
      if (currentQuestion.vocabularies && currentQuestion.vocabularies.length > 0) {
        let rows = currentQuestion.vocabularies.map(v => `
          <tr>
            <td><strong>${v.word}</strong></td>
            <td><em>${v.pos}</em></td>
            <td>${v.meaning}</td>
          </tr>
        `).join('');

        vocabHtml = `
          <div class="analysis-section">
            <div class="analysis-title">📚 多益重要單字：</div>
            <table class="vocab-table">
              <thead>
                <tr><th>單字 / 片語</th><th>詞性</th><th>中文意思</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      const formattedExplanation = currentQuestion.explanation
        .replace(/【[^】]+】/g, '')
        .trim()
        .replace(/\n/g, '<br>')
        .replace(/(考點說明|題目解析|選項解析)[:：]?/g, '<strong style="color:#2563EB;">$1：</strong>');

      analysisBox.innerHTML = `
        <div class="analysis-status" style="color: ${isCorrect ? '#059669' : '#DC2626'}">
          ${isCorrect ? '🎉 回答正確！' : '❌ 答錯囉！正確答案是：' + ['(A)', '(B)', '(C)', '(D)'][currentQuestion.answer]}
        </div>
        
        ${transcriptHtml}
        ${translationHtml}

        <div class="analysis-section">
          <div class="analysis-title">💡 題目與選項解析：</div>
          <div>${formattedExplanation}</div>
        </div>

        ${vocabHtml}
      `;

      document.getElementById('next-btn').style.display = 'block';
    }
  </script>
</body>
</html>
